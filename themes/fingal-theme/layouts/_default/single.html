{{ define "main" }}
<div class="container" style="padding-top:2rem; padding-bottom:3rem;">
  <a class="back-link" href="{{ if .Parent }}{{ .Parent.Permalink }}{{ else }}/{{ end }}">&larr; Back</a>
  <article>
    <header class="article-header">
      <h1>{{ .Title }}</h1>
      <div class="article-meta">
        {{ if not .Date.IsZero }}Published {{ .Date.Format "2 January 2006" }}{{ end }}
        {{ with .Params.author }} &middot; By {{ . }}{{ end }}
      </div>
    </header>
    <div class="article-body">
      {{ .Content }}
    </div>
  </article>
</div>
{{ end }}
